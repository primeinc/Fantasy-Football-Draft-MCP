[project]
name = "ffdraft-mcp"
version = "1.0.0"
description = "Live fantasy football draft analyst as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["fantasy-football", "mcp", "nfl", "draft", "nflverse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "mcp>=1.10",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "requests>=2.31",
  "lxml>=5.0",
  "html5lib>=1.1",
  "beautifulsoup4>=4.12",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build"]

[project.urls]
Homepage = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP"
Documentation = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/tree/main/docs"
Issues = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/issues"
Changelog = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/blob/main/CHANGELOG.md"

[project.scripts]
ffdraft-mcp = "ffdraft.server:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ty.src]
# Agent worktrees are whole checkouts with their own pyproject.toml; each is
# its own ty project when checked from inside. Checked from here they resolve
# against this checkout's src and every relative import fails. gitignore only
# governs discovery; an explicit exclude also stops the language server from
# publishing diagnostics for these files.
exclude = [".claude/worktrees/"]
