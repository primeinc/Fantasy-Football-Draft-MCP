[project]
name = "ffdraft-mcp"
version = "1.0.0"
description = "Live fantasy football draft analyst as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["fantasy-football", "mcp", "nfl", "draft", "nflverse"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Games/Entertainment",
]
dependencies = [
  "mcp>=1.2.0",
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14.0",
  "requests>=2.31",
  "lxml>=5.0",
  "html5lib>=1.1",
  "beautifulsoup4>=4.12",
  "websockets>=13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "build"]

[project.urls]
Homepage = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP"
Documentation = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/tree/main/docs"
Issues = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/issues"
Changelog = "https://github.com/zacharytran26/Fantasy-Football-Draft-MCP/blob/main/CHANGELOG.md"

[project.scripts]
ffdraft-mcp = "ffdraft.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
